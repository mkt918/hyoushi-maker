<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>表紙メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Klee+One:wght@400;600&family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@400;700&family=Yusei+Magic&family=Zen+Maru+Gothic:wght@400;700&display=swap">
<style>
:root{--bg:#e5e7eb;--panel:#fff;--ink:#1f2937;--sub:#6b7280;--line:#d1d5db;--accent:#ea580c;--navy:#14323f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--ink);font-size:13px;overflow:hidden}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;white-space:nowrap}
button:hover{background:#f3f4f6}
button.on{background:#fff1e8;border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button.danger{color:#b91c1c}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;background:var(--navy);color:#fff}
#bar b{font-size:15px;margin-right:4px}
#bar button{padding:5px 8px}
#bar .sp{flex:1}
#bar select{padding:4px 6px;border-radius:6px;border:1px solid var(--line)}
#bar .sep{width:1px;height:22px;background:#ffffff55;margin:0 2px}
#bar button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:bold}
#bar button.primary:hover{background:#c2410c}
#bar button.on{background:#fff1e8}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:60;display:flex;flex-direction:column;padding:4px;min-width:200px}
.menu[hidden]{display:none}
.menu button{border:none;text-align:left;padding:7px 10px;display:flex;align-items:center;gap:8px}
.menu button svg{flex:none}
#main{display:grid;grid-template-columns:186px 1fr 280px;min-height:0}
#thumbs{background:#f3f4f6;border-right:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.th{display:flex;gap:6px;cursor:pointer}
.th .n{width:14px;text-align:right;color:var(--sub);font-size:12px;padding-top:2px}
.th .pg{border:2px solid transparent;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);flex:none}
.th.on .pg{border-color:var(--accent)}
.th .page{pointer-events:none}
.th .page .ph{display:none}
.thb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.thb button{padding:4px 2px;font-size:12px}
.thb button:first-child{grid-column:span 3;font-weight:bold}
#stage{display:flex;align-items:center;justify-content:center;padding:24px;min-width:0;min-height:0;overflow:hidden}
#cv{position:relative;flex:none;touch-action:none;user-select:none}
#cv .page{box-shadow:0 2px 16px rgba(0,0,0,.3)}
#pg{position:absolute;inset:0}
#ov{position:absolute;inset:0;container-type:size;pointer-events:none}
#props{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px 12px 30px}
#props h3{margin:0 0 4px;font-size:14px;color:var(--navy)}
#props h4{margin:16px 0 2px;font-size:12px;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:3px}
#props label{display:block;color:var(--sub);font-size:11px;margin:8px 0 2px}
#props label.chk{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:12px;cursor:pointer}
#props input[type=text],#props input[type=number],#props select{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:#fff}
#props input[type=color]{width:100%;height:26px;padding:1px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
#props .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
#props .btns{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
#props .btns button{flex:1;min-width:calc(50% - 5px);padding:5px 4px;font-size:12px}
#props .btns button.wide{min-width:100%}
#props .hint{font-size:11px;color:var(--sub);line-height:1.65;margin-top:8px}
#props kbd{background:#f3f4f6;border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:11px}
.sw{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.sw button{width:18px;height:18px;padding:0;border-radius:4px;border:1px solid #0003}
.seg{display:flex}.seg button{flex:1;border-radius:0;margin-left:-1px;padding:4px 0}.seg button:first-child{border-radius:6px 0 0 6px;margin:0}.seg button:last-child{border-radius:0 6px 6px 0}

/* テンプレート選択 */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100}
#modal[hidden]{display:none}
.mbox{background:#fff;border-radius:12px;padding:18px 20px;width:min(760px,calc(100% - 32px));max-height:calc(100vh - 40px);overflow:auto}
.mh{display:flex;justify-content:space-between;align-items:center}
.mh b{font-size:16px}
#carryRow{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px}
#carryRow small{color:var(--sub)}
#tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
body.mono #app .page,body.mono #modal .page{filter:grayscale(1)}
.tc{cursor:pointer;border:2px solid var(--line);border-radius:10px;padding:10px;background:#fafafa}
.tc:hover{border-color:var(--accent);background:#fff}
.tp{margin:0 auto;box-shadow:0 1px 5px rgba(0,0,0,.25);background:#fff}
.tp .page{pointer-events:none}
.tn{font-weight:bold;margin-top:8px}
.td{font-size:12px;color:var(--sub);margin-top:2px}

/* ===== 表紙本体（寸法は全て cqw = ページ幅の1%） ===== */
.page{container-type:size;position:relative;background:#fff;overflow:hidden;width:100%;height:100%;
  font-family:"BIZ UDPGothic","BIZ UDGothic","Yu Gothic","Meiryo",sans-serif;color:#000}
.el{position:absolute;box-sizing:border-box;cursor:move}
.el .tx{white-space:pre-wrap;overflow-wrap:anywhere;outline:none;cursor:inherit;position:relative;text-combine-upright:none}
.el .tx[contenteditable]{cursor:text}
.el.text .tx{width:100%}
.el.bubble .tx{width:100%}
.el.bubble svg{position:absolute;left:0;top:0;overflow:visible}
.el.image{overflow:hidden}
.el.image img{position:absolute;max-width:none;pointer-events:none;-webkit-user-drag:none}
.el.image .bd{position:absolute;inset:0;pointer-events:none}
.el.image .ph{position:absolute;inset:0;border:.25cqw dashed #9ca3af;color:#9ca3af;display:flex;align-items:center;justify-content:center;text-align:center;font-size:2cqw;line-height:1.6;white-space:pre;background:#f9fafb}
.el.name{display:grid;grid-template-columns:1fr 1.5fr;font-weight:bold}
.el.name .cell{padding:.8cqw 1.2cqw;outline:none;overflow:hidden}
.el.rect{pointer-events:none}
.el.rect.filled{pointer-events:auto}
.el.rect .strip{position:absolute;pointer-events:auto;cursor:move}
.el.rect .s1{left:-.7cqw;right:-.7cqw;top:-.7cqw;height:1.4cqw}
.el.rect .s2{left:-.7cqw;right:-.7cqw;bottom:-.7cqw;height:1.4cqw}
.el.rect .s3{top:-.7cqw;bottom:-.7cqw;left:-.7cqw;width:1.4cqw}
.el.rect .s4{top:-.7cqw;bottom:-.7cqw;right:-.7cqw;width:1.4cqw}

/* 選択枠・ハンドル・ガイド */
.sel{position:absolute;outline:1.5px solid var(--accent)}
.sel.crop{outline:1.5px dashed #111}
.hd{position:absolute;width:10px;height:10px;background:#fff;border:1.5px solid var(--accent);transform:translate(-50%,-50%);pointer-events:auto;border-radius:2px}
.sel.crop .hd{background:#111;border-color:#111;border-radius:0}
.hd.tail{width:14px;height:14px;border-radius:50%;background:#f59e0b;border:2px solid #fff;box-shadow:0 0 0 1px #b45309;cursor:crosshair}
.ghost{position:absolute;opacity:.3}
.ghost img{width:100%;height:100%;display:block}
.guide{position:absolute;background:#e11d8b}
.safe{position:absolute;border:1px dashed #0ea5e9}
.cl{position:absolute;background:transparent;border-color:#0ea5e955;border-style:dashed;border-width:0}

#print{display:none}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  #app,#modal{display:none}
  #print{display:block}
  #print .page{width:var(--pw);height:var(--ph);break-after:page;page-break-after:always;box-shadow:none}
  #print .page:last-child{break-after:auto;page-break-after:auto}
  .ph,.strip{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style id="pageSize"></style>
</head>
<body>
<div id="app">
  <header id="bar">
    <b>表紙メーカー</b>
    <button id="undo" title="元に戻す (Ctrl+Z)">↶ 戻す</button>
    <button id="redo" title="やり直し (Ctrl+Y)">↷ 進む</button>
    <span class="sep"></span>
    <button id="addText">＋ テキスト</button>
    <button id="addSerif" title="白塗り・縦書きの文字。マンガの元のセリフの上に重ねて書き換える">＋ セリフ</button>
    <span class="dd"><button id="bubbleBtn">＋ 吹き出し ▾</button>
      <div class="menu" id="bubbleMenu" hidden>
        <button data-shape="oval"><svg width="26" height="20" viewBox="0 0 26 20"><path d="M20 10 A9 7 0 1 1 15 3.5 L24 1 Z" transform="rotate(180 13 10)" fill="#fff" stroke="#111" stroke-width="1.4"/></svg>丸い吹き出し</button>
        <button data-shape="round"><svg width="26" height="20" viewBox="0 0 26 20"><path d="M4 2h18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H11l-6 4 1-4H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="#fff" stroke="#111" stroke-width="1.4"/></svg>角丸の吹き出し</button>
        <button data-shape="thought"><svg width="26" height="20" viewBox="0 0 26 20"><ellipse cx="14" cy="8" rx="10" ry="6.5" fill="#fff" stroke="#111" stroke-width="1.4"/><circle cx="6" cy="16" r="2" fill="#fff" stroke="#111" stroke-width="1.2"/><circle cx="2.5" cy="18.5" r="1.2" fill="#fff" stroke="#111" stroke-width="1"/></svg>考え中（もくもく）</button>
        <button data-shape="burst"><svg width="26" height="20" viewBox="0 0 26 20"><polygon points="13,0 15.5,6 22,3 18.5,8.5 25,10 18.5,11.5 22,17 15.5,14 13,20 10.5,14 4,17 7.5,11.5 1,10 7.5,8.5 4,3 10.5,6" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg>叫び（ギザギザ）</button>
      </div></span>
    <button id="addImage">＋ 画像</button>
    <button id="addName" title="番号・名前欄">＋ 名前欄</button>
    <span class="dd"><button id="shapeBtn">＋ 図形 ▾</button>
      <div class="menu" id="shapeMenu" hidden>
        <button data-sh="frame"><svg width="22" height="16"><rect x="1.5" y="1.5" width="19" height="13" fill="none" stroke="#14323f" stroke-width="2"/></svg>枠線（中は透明）</button>
        <button data-sh="box"><svg width="22" height="16"><rect x="1" y="2" width="20" height="12" rx="2" fill="#ea580c"/></svg>塗りの四角（帯・背景）</button>
        <button data-sh="circle"><svg width="22" height="16"><circle cx="11" cy="8" r="7" fill="#fde68a"/></svg>丸</button>
        <button data-sh="line"><svg width="22" height="16"><rect x="1" y="7" width="20" height="2" fill="#1f2937"/></svg>横線</button>
      </div></span>
    <span class="sep"></span>
    <button id="tplBtn" title="この表紙のテンプレートを変える">テンプレ</button>
    <button id="guideBtn" title="印刷の安全範囲（各辺10mm）と中心線を表示">ガイド</button>
    <button id="monoBtn" title="白黒で印刷したときの見え方で表示（画面だけ。印刷データは変わらない）">白黒表示</button>
    <span class="sp"></span>
    <button id="exportBtn" title="画像ごとファイルに保存。別のPCへ持ち運べる">書き出し</button>
    <button id="importBtn">読み込み</button>
    <select id="paper" title="用紙サイズ">
      <option value="B4">B4 横</option>
      <option value="A4">A4 横</option>
      <option value="A3">A3 横</option>
    </select>
    <button id="printCur" class="primary" title="表示中の表紙を印刷・PDF保存">印刷</button>
    <button id="printAll" class="primary" title="すべての表紙を1つにまとめて印刷・PDF保存">まとめて印刷</button>
  </header>
  <div id="main">
    <aside id="thumbs"></aside>
    <main id="stage"><div id="cv"><div id="pg"></div><div id="ov"></div></div></main>
    <aside id="props"></aside>
  </div>
</div>
<div id="modal" hidden><div class="mbox">
  <div class="mh"><b id="mtitle">テンプレートを選ぶ</b><button id="mclose">閉じる</button></div>
  <label id="carryRow"><input type="checkbox" id="carry" checked> 今の画像・タイトル・注意書きを引き継ぐ <small>（画像の上の吹き出し・セリフも一緒に移動）</small></label>
  <div id="tgrid"></div>
</div></div>
<div id="print"></div>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="jfile" accept=".json,application/json" hidden>

<script>
"use strict";
const PAPERS={B4:[364,257],A4:[297,210],A3:[420,297]};
const FONTS=[
  ["gothic","標準ゴシック（BIZ UD）",'"BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif'],
  ["notosans","Noto Sans（くっきり）",'"Noto Sans JP","BIZ UDPGothic",sans-serif'],
  ["maru","Zen 丸ゴシック（やさしい）",'"Zen Maru Gothic","M PLUS Rounded 1c","Yu Gothic",sans-serif'],
  ["rounded","M PLUS 丸ゴ（元気）",'"M PLUS Rounded 1c","Zen Maru Gothic",sans-serif'],
  ["pop","Dela Gothic（極太ポップ）",'"Dela Gothic One","Noto Sans JP",sans-serif'],
  ["klee","Klee（教科書体ふう）",'"Klee One","UD Digi Kyokasho NP-R","Yu Mincho",serif'],
  ["mincho","しっぽり明朝（上品）",'"Shippori Mincho","Noto Serif JP","BIZ UDPMincho","Yu Mincho",serif'],
  ["notoserif","Noto 明朝（読みやすい）",'"Noto Serif JP","BIZ UDPMincho","Yu Mincho",serif'],
  ["hand","手書き風",'"Yusei Magic","Klee One",cursive'],
  ["meiryo","メイリオ（PC内蔵）",'"Meiryo","Yu Gothic",sans-serif']
];
const fontCss=id=>(FONTS.find(f=>f[0]===id)||FONTS[0])[2];
const GRAYS=["#000000","#1f1f1f","#404040","#595959","#808080","#a6a6a6","#cccccc","#e6e6e6","#f2f2f2","#ffffff"];   // 白黒印刷の基本色
const SW=[...GRAYS,"#14323f","#1d4ed8","#0f766e","#15803d","#ea580c","#f59e0b","#dc2626","#db2777","#7c3aed"];
const LIGHT=["#fff7e6","#fef9c3","#fde68a","#fed7aa","#fce7f3","#ede9fe","#dbeafe","#dcfce7"];
const $=id=>document.getElementById(id);
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const fx=n=>(+n).toFixed(2);
const curPaper=()=>typeof state==="undefined"?"B4":state.paper;
const pageH=()=>{const p=PAPERS[curPaper()];return 100*p[1]/p[0];};      // ページ高さ(cqw)
const ptPer=()=>PAPERS[curPaper()][0]*72/25.4/100;                       // 1cqw が何pt か
const mmPer=()=>PAPERS[curPaper()][0]/100;                               // 1cqw が何mm か

/* ---------- 要素の型 ---------- */
const NOTES="しっかりと勉強をしてきてください！\n〇もつけて提出です\n\n提出日（　考査日、○○の机に　）\nレポート提出・小テスト（○/○頃）";
function mkText(o={}){return Object.assign({id:uid(),type:"text",role:"",text:"テキスト",x:10,y:10,w:40,h:8,
  font:"gothic",fs:3,bold:false,vertical:false,align:"start",va:"start",lh:1.4,ls:0,color:"#000000",
  fill:"",border:false,bw:.25,bc:"#000000",bs:"solid",radius:0,shadow:false,pad:0},o);}
function mkImage(o={}){const e=Object.assign({id:uid(),type:"image",a:"",ar:1,x:8,y:25.5,w:40,h:37.6,cx:0,cy:0,cw:40,lock:true,
  bw:0,bc:"#000000",bs:"solid",radius:0,shadow:false},o);if(e.ch==null)e.ch=e.cw/e.ar;return e;}
function mkName(o={}){return Object.assign({id:uid(),type:"name",x:50,y:56.7,w:42,h:6.4,l1:"番号",l2:"名前",
  font:"gothic",fs:2.3,color:"#000000",fill:"",bw:.25,bc:"#000000",bs:"solid",radius:0,shadow:false},o);}
function mkRect(o={}){return Object.assign({id:uid(),type:"rect",x:5.5,y:5.5,w:89,h:pageH()-11,
  fill:"",bw:.45,bc:"#14323f",bs:"solid",radius:0,shadow:false},o);}
function mkBubble(o={}){return Object.assign({id:uid(),type:"bubble",shape:"oval",text:"ここに\nセリフ",x:40,y:20,w:13,h:20,
  font:"gothic",fs:2.6,bold:true,vertical:true,align:"center",va:"center",lh:1.3,ls:0,color:"#000000",
  fill:"#ffffff",bw:.3,bc:"#000000",bs:"solid",pad:.6,tx:-3,ty:24,tw:3},o);}
const MK={text:mkText,image:mkImage,name:mkName,rect:mkRect,bubble:mkBubble};
function norm(e){                                 // 旧バージョンの保存データを今の形にそろえる
  const lg={};
  if(e.bc===undefined&&e.color&&e.type!=="image")lg.bc=e.color;
  if(e.type==="text"&&e.border&&e.pad===undefined)lg.pad=1.4;
  if(e.align==="left")e.align="start";if(e.align==="right")e.align="end";
  const o=Object.assign(MK[e.type](),lg,e);
  if(o.type==="image"&&o.ch==null)o.ch=o.cw/o.ar;
  return o;
}

/* ---------- テンプレート ---------- */
const TEMPLATES=[
  {name:"スタンダード",desc:"太い外枠＋左に画像。いちばん見やすい基本形",make(){return{bg:"#ffffff",els:[
    mkRect(),
    mkText({role:"title",text:"○年生 ○○ ○学期期末考査\nテスト対策完璧最高プリント",x:8,y:7.5,w:84,h:16,fs:5.2,lh:1.28}),
    mkImage({x:8,y:25.5,w:40,h:37.6,cw:40}),
    mkText({role:"notes",text:NOTES,x:50,y:34,w:42,h:20,fs:2.2,border:true,lh:1.55,pad:1.4}),
    mkName()]};}},
  {name:"サイドバー",desc:"左に紺の帯とタイトル。科目名がひと目で分かる",make(){const H=pageH();return{bg:"#ffffff",els:[
    mkRect({x:0,y:0,w:32,h:H,bw:0,fill:"#14323f"}),
    mkRect({x:32,y:0,w:1,h:H,bw:0,fill:"#f59e0b"}),
    mkText({role:"sub",text:"PRINT",x:4,y:6,w:25,h:4,fs:2.2,ls:.3,color:"#f59e0b",bold:true,font:"notosans"}),
    mkText({role:"title",text:"○年生\n○○\n○学期\n期末考査",x:4,y:12,w:25,h:36,fs:5.2,bold:true,color:"#ffffff",lh:1.3,font:"notosans"}),
    mkText({role:"sub2",text:"テスト対策プリント",x:4,y:H-13,w:25,h:7,fs:2.5,color:"#ffffff",font:"notosans",va:"end",lh:1.4}),
    mkImage({x:37,y:6,w:57,h:32,cw:57}),
    mkRect({x:37,y:42,w:.8,h:15.5,bw:0,fill:"#f59e0b"}),
    mkText({role:"notes",text:NOTES,x:39.5,y:41.5,w:54.5,h:16.5,fs:2.2,lh:1.5,font:"notosans",color:"#1f2937"}),
    mkName({x:37,y:59.5,w:57,h:6.5,fs:2.2,font:"notosans",color:"#14323f",bw:.3,bc:"#14323f"})]};}},
  {name:"ポップ",desc:"オレンジの見出し帯と丸い飾り。明るく親しみやすい",make(){const H=pageH();return{bg:"#fff7e6",els:[
    mkRect({x:-7,y:-9,w:24,h:24,bw:0,fill:"#fde68a",radius:12}),

  open(){return new Promise((res,rej)=>{const r=indexedDB.open("hyoushi-maker",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},

/* ---------- 履歴 (undo/redo) ---------- */
let hist=[],hi=-1;
const snap=()=>JSON.stringify({covers:state.covers,cur:state.cur});
function changed(){
  const s=snap();if(hist[hi]===s)return;
  hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>100)hist.shift();hi=hist.length-1;
  renderThumbs();updateUndoBtns();save();
}
function restore(){
  const o=JSON.parse(hist[hi]);state.covers=o.covers;state.cur=Math.min(o.cur,o.covers.length-1);
  if(!selEl())ui.sel=null;ui.crop=false;fullRender();save();
}
const undo=()=>{if(hi>0){hi--;restore();}};
const redo=()=>{if(hi<hist.length-1){hi++;restore();}};
function updateUndoBtns(){$("undo").disabled=hi<=0;$("redo").disabled=hi>=hist.length-1;}

/* ---------- 吹き出しの形（SVG。単位は cqw そのまま） ---------- */
function bubbleInner(el){
  const w=el.w,h=el.h,bw=el.bw,hw=bw/2,cx=w/2,cy=h/2;
  const fill=el.fill||"#ffffff",st=bw>0?el.bc:"none";
  const dash=el.bs==="dashed"?`stroke-dasharray="${fx(bw*3)} ${fx(bw*2)}"`:el.bs==="dotted"?`stroke-dasharray="0.01 ${fx(bw*2)}" stroke-linecap="round"`:"";
  const S=`fill="${fill}" stroke="${st}" stroke-width="${fx(bw)}" stroke-linejoin="round" ${dash}`;
  const tip={x:el.tx,y:el.ty},P=p=>fx(p.x)+","+fx(p.y);
  const rx=Math.max(.5,w/2-hw),ry=Math.max(.5,h/2-hw);
  if(el.shape==="burst"){
    const n=12,pts=[];
    for(let i=0;i<n*2;i++){const a=i*Math.PI/n-Math.PI/2,k=i%2?.7+.08*Math.sin(i*2.1):1;pts.push(P({x:cx+rx*k*Math.cos(a),y:cy+ry*k*Math.sin(a)}));}
    return `<polygon points="${pts.join(" ")}" ${S}/>`;
  }
  if(el.shape==="round"){
    const L=hw,T=hw,R=w-hw,B=h-hw,r=Math.max(0,Math.min(Math.min(w,h)*.22,(R-L)/2,(B-T)/2)),half=el.tw/2;
    let side=null,c=0;
    if(!(tip.x>=L&&tip.x<=R&&tip.y>=T&&tip.y<=B)){
      const dx=(tip.x-cx)/(w/2),dy=(tip.y-cy)/(h/2);
      if(Math.abs(dx)>=Math.abs(dy)){side=dx>0?"R":"L";c=cy+(tip.y-cy)*(w/2)/Math.abs(tip.x-cx);const lo=T+r+half,hi=B-r-half;c=lo>hi?cy:Math.min(hi,Math.max(lo,c));}
      else{side=dy>0?"B":"T";c=cx+(tip.x-cx)*(h/2)/Math.abs(tip.y-cy);const lo=L+r+half,hi=R-r-half;c=lo>hi?cx:Math.min(hi,Math.max(lo,c));}
    }
    const tp=P(tip),A=(x,y)=>` A${fx(r)} ${fx(r)} 0 0 1 ${fx(x)},${fx(y)}`;
    let d=`M${fx(L+r)},${fx(T)}`;
    if(side==="T")d+=` L${fx(c-half)},${fx(T)} L${tp} L${fx(c+half)},${fx(T)}`;
    d+=` L${fx(R-r)},${fx(T)}`+A(R,T+r);
    if(side==="R")d+=` L${fx(R)},${fx(c-half)} L${tp} L${fx(R)},${fx(c+half)}`;
    d+=` L${fx(R)},${fx(B-r)}`+A(R-r,B);
    if(side==="B")d+=` L${fx(c+half)},${fx(B)} L${tp} L${fx(c-half)},${fx(B)}`;
    d+=` L${fx(L+r)},${fx(B)}`+A(L,B-r);
    if(side==="L")d+=` L${fx(L)},${fx(c+half)} L${tp} L${fx(L)},${fx(c-half)}`;
    d+=` L${fx(L)},${fx(T+r)}`+A(L+r,T)+" Z";
    return `<path d="${d}" ${S}/>`;
  }
  // 丸・考え中
  const ell=`<ellipse cx="${fx(cx)}" cy="${fx(cy)}" rx="${fx(rx)}" ry="${fx(ry)}" ${S}/>`;
  if(((tip.x-cx)/rx)**2+((tip.y-cy)/ry)**2<=1)return ell;
  const t=Math.atan2((tip.y-cy)/ry,(tip.x-cx)/rx),pt=a=>({x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)});
  if(el.shape==="thought"){
    const b=pt(t);let s="";
    [[.28,.45],[.6,.32],[.9,.2]].forEach(([f,k])=>{s+=`<ellipse cx="${fx(b.x+(tip.x-b.x)*f)}" cy="${fx(b.y+(tip.y-b.y)*f)}" rx="${fx(el.tw*k)}" ry="${fx(el.tw*k*.85)}" ${S}/>`;});
    return ell+s;
  }
  const d=Math.min(1.2,el.tw/(rx+ry)),b1=pt(t-d),b2=pt(t+d);   // 楕円の長い側を回ってしっぽへ（継ぎ目の出ない1本のパス）
  return `<path d="M${P(b2)} A${fx(rx)} ${fx(ry)} 0 1 1 ${P(b1)} L${P(tip)} Z" ${S}/>`;
}
function drawBubble(n,el){
  let svg=n.querySelector("svg");
  if(!svg){svg=document.createElementNS("http://www.w3.org/2000/svg","svg");n.prepend(svg);}
  svg.setAttribute("viewBox",`0 0 ${fx(Math.max(.1,el.w))} ${fx(Math.max(.1,el.h))}`);
  svg.style.width=el.w+"cqw";svg.style.height=el.h+"cqw";svg.innerHTML=bubbleInner(el);
  const k={oval:.14,thought:.14,burst:.21,round:.05}[el.shape]||.1;
  n.style.padding=`${el.pad+el.h*k}cqw ${el.pad+el.w*k}cqw`;
}

/* ---------- 要素のDOM ---------- */
const div=(cls)=>{const d=document.createElement("div");if(cls)d.className=cls;return d;};
function geom(n,el){
  n.style.left=el.x+"cqw";n.style.top=el.y+"cqw";n.style.width=el.w+"cqw";n.style.height=el.h+"cqw";
  if(el.type==="image"){const im=n.querySelector("img");if(im){im.style.left=el.cx+"cqw";im.style.top=el.cy+"cqw";im.style.width=el.cw+"cqw";im.style.height=el.ch+"cqw";}}
  if(el.type==="bubble")drawBubble(n,el);
}
function deco(n,el,border){
  if(el.fill)n.style.background=el.fill;
  if(border&&el.bw>0)n.style.border=`${el.bw}cqw ${el.bs} ${el.bc}`;
  if(el.radius)n.style.borderRadius=el.radius+"cqw";
  if(el.shadow)n.style.boxShadow=".7cqw .7cqw 0 rgba(0,0,0,.28)";
}
function textStyle(n,t,el){
  Object.assign(n.style,{fontFamily:fontCss(el.font),fontSize:el.fs+"cqw",fontWeight:el.bold?"700":"400",
    lineHeight:String(el.lh),color:el.color,letterSpacing:el.ls+"em",display:"flex",
    flexDirection:el.vertical?"row-reverse":"column",
    justifyContent:{start:"flex-start",center:"center",end:"flex-end"}[el.va]});
  t.style.textAlign=el.align;
  if(el.vertical){t.style.writingMode="vertical-rl";t.style.height="100%";t.style.width="auto";t.style.textCombineUpright="digits 2";}
}
function mk(el){
  const n=div("el "+el.type);n.dataset.id=el.id;
  if(el.type==="text"||el.type==="bubble"){
    const t=div("tx");t.textContent=el.text;n.appendChild(t);textStyle(n,t,el);
    if(el.type==="text"){deco(n,el,el.border);n.style.padding=el.pad+"cqw";}
  }else if(el.type==="image"){
    if(el.a&&state.assets[el.a]){const im=new Image();im.src=state.assets[el.a];im.draggable=false;n.appendChild(im);}
    else{const ph=div("ph");ph.textContent="画像をドロップ\nまたはダブルクリック";n.appendChild(ph);}
    if(el.radius)n.style.borderRadius=el.radius+"cqw";
    if(el.shadow)n.style.boxShadow=".7cqw .7cqw 0 rgba(0,0,0,.28)";
    if(el.bw>0){const b=div("bd");b.style.border=`${el.bw}cqw ${el.bs} ${el.bc}`;if(el.radius)b.style.borderRadius=el.radius+"cqw";n.appendChild(b);}
  }else if(el.type==="name"){
    Object.assign(n.style,{fontFamily:fontCss(el.font),fontSize:el.fs+"cqw",color:el.color});deco(n,el,true);
    ["l1","l2"].forEach((k,i)=>{const c=div("cell");c.dataset.cell=k;c.textContent=el[k];
      if(i===1&&el.bw>0)c.style.borderLeft=`${el.bw}cqw solid ${el.bc}`;n.appendChild(c);});
  }else if(el.type==="rect"){
    deco(n,el,el.bw>0);if(el.fill)n.classList.add("filled");
    for(let i=1;i<=4;i++){const s=div("strip s"+i);s.dataset.id=el.id;n.appendChild(s);}
  }
  geom(n,el);return n;
}
function buildPage(c){const p=div("page");p.style.background=c.bg||"#ffffff";c.els.forEach(e=>p.appendChild(mk(e)));return p;}
function renderPage(){$("pg").replaceChildren(buildPage(cur()));}
const nodeOf=id=>$("pg").querySelector(`.el[data-id="${id}"]`);
const scale=()=>$("cv").clientWidth/100;

/* ---------- 文字のはみ出し判定と自動縮小 ---------- */
function overflows(n){
  const t=n.querySelector(".tx");if(!t)return false;const cs=getComputedStyle(n);
  const aw=n.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=n.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  return t.scrollWidth>aw+1||t.scrollHeight>ah+1;
}
function autoGrow(el){                     // 編集後に文字があふれたら枠を広げる（縦書きは右端を固定して左へ）
  const n=nodeOf(el.id);if(!n||!overflows(n))return;const s=scale();
  if(el.vertical){const o=n.style.width;n.style.width="max-content";const w=n.getBoundingClientRect().width/s;n.style.width=o;if(w>el.w){el.x-=w-el.w;el.w=w;}}
  else{const o=n.style.height;n.style.height="auto";const hh=n.getBoundingClientRect().height/s;n.style.height=o;if(hh>el.h)el.h=hh;}
}
function fitText(el){
  const n=nodeOf(el.id);if(!n)return;let k=0;
  while(overflows(n)&&el.fs>.8&&k++<60){el.fs*=.95;n.style.fontSize=el.fs+"cqw";}
}

/* ---------- 選択枠オーバーレイ ---------- */
const HANDLES={nw:[0,0],n:[50,0],ne:[100,0],e:[100,50],se:[100,100],s:[50,100],sw:[0,100],w:[0,50]};
const CURSOR={nw:"nwse-resize",se:"nwse-resize",ne:"nesw-resize",sw:"nesw-resize",n:"ns-resize",s:"ns-resize",e:"ew-resize",w:"ew-resize"};
function renderOverlay(){
  const ov=$("ov");ov.replaceChildren();const H=pageH();
  if(ui.safe){
    const m=10/mmPer(),r=div("safe");Object.assign(r.style,{left:m+"cqw",top:m+"cqw",width:(100-2*m)+"cqw",height:(H-2*m)+"cqw"});ov.appendChild(r);
    const v=div("cl");Object.assign(v.style,{left:"50cqw",top:0,height:H+"cqw",borderLeftWidth:"1px"});ov.appendChild(v);
    const hz=div("cl");Object.assign(hz.style,{top:(H/2)+"cqw",left:0,width:"100cqw",borderTopWidth:"1px"});ov.appendChild(hz);
  }
  ui.guides.forEach(g=>{const d=div("guide");
    if(g.axis==="x")Object.assign(d.style,{left:g.pos+"cqw",top:0,width:"1px",height:H+"cqw"});
    else Object.assign(d.style,{top:g.pos+"cqw",left:0,height:"1px",width:"100cqw"});
    ov.appendChild(d);});
  const el=selEl();if(!el)return;
  const crop=ui.crop&&el.type==="image"&&el.a;
  if(crop&&state.assets[el.a]){
    const g=div("ghost");Object.assign(g.style,{left:(el.x+el.cx)+"cqw",top:(el.y+el.cy)+"cqw",width:el.cw+"cqw",height:el.ch+"cqw"});
    const im=new Image();im.src=state.assets[el.a];g.appendChild(im);ov.appendChild(g);
  }
  const b=div("sel"+(crop?" crop":""));Object.assign(b.style,{left:el.x+"cqw",top:el.y+"cqw",width:el.w+"cqw",height:el.h+"cqw"});
  const list=(el.type==="image"&&!crop&&el.lock)?["nw","ne","se","sw"]:Object.keys(HANDLES);
  list.forEach(k=>{const hd=div("hd");hd.dataset.h=k;hd.style.left=HANDLES[k][0]+"%";hd.style.top=HANDLES[k][1]+"%";hd.style.cursor=CURSOR[k];b.appendChild(hd);});
  if(el.type==="bubble"&&el.shape!=="burst"){const t=div("hd tail");t.dataset.h="tail";t.title="しっぽの先（ドラッグで向きを変える）";t.style.left=el.tx+"cqw";t.style.top=el.ty+"cqw";b.appendChild(t);}
  ov.appendChild(b);
}

/* ---------- 描画まとめ ---------- */
function fullRender(){renderPage();renderOverlay();renderProps();renderThumbs();updateUndoBtns();fit();}
function refresh(){renderPage();renderOverlay();}      // パネル操作中の再描画（パネルは作り直さない）
function touch(el){const n=nodeOf(el.id);if(n)geom(n,el);renderOverlay();syncGeom();}   // ドラッグ中の軽い更新
function fit(){
  const st=$("stage"),H=pageH();
  const aw=st.clientWidth-48,ah=st.clientHeight-48;
  const w=Math.max(240,Math.min(aw,ah*100/H));
  const cv=$("cv");cv.style.width=w+"px";cv.style.height=(w*H/100)+"px";
}
let thT;
function renderThumbs(){
  cancelAnimationFrame(thT);thT=requestAnimationFrame(()=>{
    const box=$("thumbs");box.replaceChildren();
    state.covers.forEach((c,i)=>{

/* ---------- 画像 ---------- */
function loadImage(file){
  return new Promise(res=>{
    if(!file||!file.type.startsWith("image/"))return res(null);
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const MAX=2400,s=Math.min(1,MAX/Math.max(im.naturalWidth,im.naturalHeight));
      const cv=document.createElement("canvas");cv.width=Math.round(im.naturalWidth*s);cv.height=Math.round(im.naturalHeight*s);
      const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);
      const a=uid();state.assets[a]=cv.toDataURL("image/jpeg",0.9);URL.revokeObjectURL(url);res({a,ar:cv.width/cv.height});
    };
    im.onerror=()=>{URL.revokeObjectURL(url);res(null);};
    im.src=url;
  });
}
function fitInto(el,bx,by,bw,bh){          // 画像を枠(bx,by,bw,bh)に収まる最大サイズで中央に置く
  let w=bw,hh=bw/el.ar;if(hh>bh){hh=bh;w=bh*el.ar;}
  Object.assign(el,{x:bx+(bw-w)/2,y:by+(bh-hh)/2,w,h:hh,cx:0,cy:0,cw:w,ch:hh});
}
const resetCrop=el=>fitInto(el,el.x,el.y,el.w,el.h);
function fitFrameToImage(el){el.x+=el.cx;el.y+=el.cy;el.w=el.cw;el.h=el.ch;el.cx=0;el.cy=0;}
function restoreRatio(el){
  const plain=Math.abs(el.cx)<.01&&Math.abs(el.cy)<.01&&Math.abs(el.w-el.cw)<.05&&Math.abs(el.h-el.ch)<.05;
  el.ch=el.cw/el.ar;if(plain)el.h=el.ch;
}
async function setImage(file,targetId){
  const r=await loadImage(file);if(!r)return;
  let el=targetId&&byId(targetId);
  if(el&&el.type==="image"){el.a=r.a;el.ar=r.ar;fitInto(el,el.x,el.y,el.w,el.h);}
  else{el=mkImage({a:r.a,ar:r.ar});fitInto(el,8,25.5,50,Math.min(38,pageH()-30));cur().els.push(el);}
  ui.sel=el.id;ui.crop=false;changed();fullRender();
}

let tplMode="add";
function openTemplates(mode){
  tplMode=mode;$("modal").hidden=false;
  $("mtitle").textContent=mode==="add"?"新しい表紙のテンプレートを選ぶ":"この表紙のテンプレートを変える";
  $("carryRow").style.display=mode==="apply"?"":"none";
  const grid=$("tgrid");grid.replaceChildren();
  TEMPLATES.forEach((t,i)=>{
    const card=div("tc"),pg=div("tp");pg.style.width="260px";pg.style.height=(260*pageH()/100)+"px";
    pg.appendChild(buildPage(t.make()));
    card.append(pg,E("div",{className:"tn",textContent:`テンプレート${i+1}　${t.name}`}),E("div",{className:"td",textContent:t.desc}));
    card.onclick=()=>{$("modal").hidden=true;
      if(tplMode==="add"){state.covers.push(coverFrom(t));state.cur=state.covers.length-1;ui.sel=null;changed();fullRender();}

function applyTemplate(t,carry){
  const old=cur(),nc=t.make();
  if(carry){
    const oi=old.els.find(e=>e.type==="image"&&e.a),ni=nc.els.find(e=>e.type==="image");
    if(oi&&ni){
      // 切り抜き・変形をそのまま保って新しい枠に収め、画像の上の吹き出し・セリフも同じ比率で移す
      const k=Math.min(ni.w/oi.w,ni.h/oi.h),nx=ni.x+(ni.w-oi.w*k)/2,ny=ni.y+(ni.h-oi.h*k)/2;
      Object.assign(ni,{a:oi.a,ar:oi.ar,x:nx,y:ny,w:oi.w*k,h:oi.h*k,cx:oi.cx*k,cy:oi.cy*k,cw:oi.cw*k,ch:oi.ch*k,lock:oi.lock});
      old.els.forEach(e=>{
        if(e===oi||e.role||!(e.type==="bubble"||e.type==="text"||e.type==="image"))return;
        const mx=e.x+e.w/2,my=e.y+e.h/2;if(mx<oi.x||mx>oi.x+oi.w||my<oi.y||my>oi.y+oi.h)return;
        const c=clone(e);c.x=nx+(e.x-oi.x)*k;c.y=ny+(e.y-oi.y)*k;c.w=e.w*k;c.h=e.h*k;
        if(c.fs)c.fs*=k;if(c.type==="bubble"){c.tx*=k;c.ty*=k;c.tw*=k;}
        if(c.type==="image"){c.cx*=k;c.cy*=k;c.cw*=k;c.ch*=k;}
        nc.els.push(c);
      });
    }
    nc.els.forEach(n=>{if(!n.role)return;const o=old.els.find(e=>e.role===n.role);if(o&&o.text!=null)n.text=o.text;});
    const on=old.els.find(e=>e.type==="name"),nn=nc.els.find(e=>e.type==="name");if(on&&nn){nn.l1=on.l1;nn.l2=on.l2;}
  }
  old.bg=nc.bg;old.els=nc.els;ui.sel=null;ui.crop=false;fullRender();
  if(carry){old.els.forEach(e=>{if(e.role)fitText(e);});refresh();}
  changed();
}

/* ---------- 書き出し・読み込み ---------- */
function usedAssets(covers){const s=new Set();covers.forEach(c=>c.els.forEach(e=>{if(e.a)s.add(e.a);}));return s;}
$("exportBtn").onclick=()=>{
  const assets={};usedAssets(state.covers).forEach(a=>{if(state.assets[a])assets[a]=state.assets[a];});
  const data={app:"hyoushi-maker",version:2,paper:state.paper,covers:state.covers,assets};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));
  const d=new Date(),p=n=>String(n).padStart(2,"0");a.download=`表紙_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`;
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
$("importBtn").onclick=()=>$("jfile").click();
$("jfile").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(d.app!=="hyoushi-maker"||!Array.isArray(d.covers))throw 0;
    if(!confirm("今の表紙をすべて置き換えて読み込みますか？（元に戻すで戻せます）"))return;
    Object.assign(state.assets,d.assets||{});
    state.paper=PAPERS[d.paper]?d.paper:"B4";
    state.covers=d.covers.map(c=>({id:c.id||uid(),bg:c.bg||"#ffffff",els:(c.els||[]).filter(x=>MK[x.type]).map(norm)}));
    state.cur=0;ui.sel=null;applyPaper();changed();fullRender();
  }catch(err){alert("表紙メーカーのファイルとして読み込めませんでした。");}
};

/* ---------- マウス操作（移動・リサイズ・トリミング・しっぽ） ---------- */
let drag=null;
function snapMove(el,nx,ny,alt){
  ui.guides=[];if(alt)return [nx,ny];
  const T=.9,H=pageH(),xs=[0,50,100],ys=[0,H/2,H];
  cur().els.forEach(o=>{if(o===el)return;xs.push(o.x,o.x+o.w/2,o.x+o.w);ys.push(o.y,o.y+o.h/2,o.y+o.h);});
  const best=(vals,cands)=>{let b=null;vals.forEach(v=>cands.forEach(c=>{const d=Math.abs(v-c);if(d<T&&(!b||d<b.d))b={d,shift:c-v,pos:c};}));return b;};
  const bx=best([nx,nx+el.w/2,nx+el.w],xs),by=best([ny,ny+el.h/2,ny+el.h],ys);
  if(bx){nx+=bx.shift;ui.guides.push({axis:"x",pos:bx.pos});}
  if(by){ny+=by.shift;ui.guides.push({axis:"y",pos:by.pos});}
  return [nx,ny];
}
function doResize(el,o,hd,dx,dy,crop){
  const MIN=.3,E_=hd.includes("e"),W=hd.includes("w"),S=hd.includes("s"),N=hd.includes("n");
  if(el.type==="image"&&!crop){                                   // 通常時：画像ごと拡大縮小
    let fx_=1,fy_=1;
    if(E_)fx_=(o.w+dx)/o.w;if(W)fx_=(o.w-dx)/o.w;if(S)fy_=(o.h+dy)/o.h;if(N)fy_=(o.h-dy)/o.h;
    if(el.lock)fy_=fx_;
    fx_=Math.max(.03,fx_);fy_=Math.max(.03,fy_);
    el.w=o.w*fx_;el.cx=o.cx*fx_;el.cw=o.cw*fx_;el.h=o.h*fy_;el.cy=o.cy*fy_;el.ch=o.ch*fy_;
    el.x=W?o.x+o.w-el.w:o.x;el.y=N?o.y+o.h-el.h:o.y;return;
  }
  let {x,y,w,h}=o,cx=o.cx,cy=o.cy;
  if(E_)w=Math.max(MIN,o.w+dx);
  if(S)h=Math.max(MIN,o.h+dy);
  if(W){const d=Math.min(dx,o.w-MIN);x=o.x+d;w=o.w-d;cx=o.cx-d;}
  if(N){const d=Math.min(dy,o.h-MIN);y=o.y+d;h=o.h-d;cy=o.cy-d;}
  el.x=x;el.y=y;el.w=w;el.h=h;
  if(el.type==="image"){el.cx=cx;el.cy=cy;}
  if(el.type==="bubble"){el.tx=o.tx+(o.x-el.x);el.ty=o.ty+(o.y-el.y);}   // しっぽの先は紙の上の位置を保つ
}
const cvEl=$("cv");
cvEl.addEventListener("pointerdown",e=>{
  if(e.button!==0||e.target.isContentEditable)return;
  const hd=e.target.dataset&&e.target.dataset.h;
  const node=e.target.closest&&e.target.closest("[data-id]");
  const id=hd?ui.sel:(node&&node.dataset.id);
  const ae=document.activeElement;if(ae&&ae.isContentEditable)ae.blur();
  if(!id){if(ui.sel){ui.sel=null;ui.crop=false;renderOverlay();renderProps();}return;}
  const el=byId(id);if(!el)return;
  if(ui.sel!==id){ui.sel=id;ui.crop=false;renderProps();}
  const kind=hd==="tail"?"tail":hd?"resize":(ui.crop&&el.type==="image"&&el.a?"pan":"move");
  drag={kind,hd,id,sx:e.clientX,sy:e.clientY,o:clone(el),moved:false,s:scale()};
  cvEl.setPointerCapture(e.pointerId);e.preventDefault();renderOverlay();
});
cvEl.addEventListener("pointermove",e=>{
  if(!drag)return;
  const dx=(e.clientX-drag.sx)/drag.s,dy=(e.clientY-drag.sy)/drag.s;
  if(!drag.moved&&Math.hypot(dx,dy)*drag.s<3)return;
  drag.moved=true;const el=byId(drag.id),o=drag.o;if(!el)return;
  if(drag.kind==="move"){const [nx,ny]=snapMove(el,o.x+dx,o.y+dy,e.altKey);el.x=nx;el.y=ny;}
  else if(drag.kind==="pan"){el.cx=o.cx+dx;el.cy=o.cy+dy;}
  else if(drag.kind==="tail"){el.tx=o.tx+dx;el.ty=o.ty+dy;}
  else doResize(el,o,drag.hd,dx,dy,ui.crop);
  touch(el);
});
function endDrag(){if(!drag)return;const m=drag.moved;drag=null;ui.guides=[];renderOverlay();if(m)changed();}
cvEl.addEventListener("pointerup",endDrag);cvEl.addEventListener("pointercancel",endDrag);
let idleT;const changedSoon=()=>{clearTimeout(idleT);idleT=setTimeout(changed,300);};
cvEl.addEventListener("wheel",e=>{
  const el=selEl();if(!(ui.crop&&el&&el.type==="image"&&el.a))return;
  e.preventDefault();
  const f=Math.exp(-e.deltaY*0.0015),r=cvEl.getBoundingClientRect(),s=scale();
  const px=(e.clientX-r.left)/s-el.x,py=(e.clientY-r.top)/s-el.y;
  el.cx=px-(px-el.cx)*f;el.cy=py-(py-el.cy)*f;el.cw*=f;el.ch*=f;
  touch(el);changedSoon();
},{passive:false});

/* ---------- ダブルクリック：文字の編集 / トリミング ---------- */
function editInline(t,onDone){
  if(!t)return;
  t.contentEditable="plaintext-only";t.focus();
  const r=document.createRange();r.selectNodeContents(t);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);
  const done=()=>{t.removeEventListener("blur",done);t.removeAttribute("contenteditable");onDone(t.innerText.replace(/\n$/,""));};
  t.addEventListener("blur",done);
  t.addEventListener("keydown",ev=>{if(ev.key==="Escape"){ev.preventDefault();t.blur();}ev.stopPropagation();});
}
function editEl(el,target){
  const n=nodeOf(el.id);if(!n)return;
  if(el.type==="text"||el.type==="bubble")editInline(n.querySelector(".tx"),v=>{el.text=v;refresh();if(el.type==="text")autoGrow(el);refresh();changed();});
  else if(el.type==="name"){const c=(target&&target.closest(".cell"))||n.querySelector(".cell");editInline(c,v=>{el[c.dataset.cell]=v;changed();refresh();renderProps();});}
}
cvEl.addEventListener("dblclick",e=>{
  const tg=document.elementFromPoint(e.clientX,e.clientY)||e.target;   // ポインターキャプチャ中は e.target が #cv になるため座標から引く
  const node=tg.closest&&tg.closest("[data-id]");if(!node)return;
  const el=byId(node.dataset.id);if(!el)return;
  if(el.type==="image"){if(!el.a)pickImage(el.id);else{ui.crop=!ui.crop;renderOverlay();renderProps();}}
  else editEl(el,tg);
});

/* ---------- ドロップ・貼り付け ---------- */
const stage=$("stage");
stage.addEventListener("dragover",e=>e.preventDefault());
stage.addEventListener("drop",e=>{
  e.preventDefault();const f=e.dataTransfer.files[0];if(!f)return;
  const node=document.elementFromPoint(e.clientX,e.clientY);const t=node&&node.closest&&node.closest("[data-id]");
  const el=t&&byId(t.dataset.id);setImage(f,el&&el.type==="image"?el.id:null);
});
document.addEventListener("paste",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||"")||e.target.isContentEditable)return;
  for(const it of e.clipboardData.items){
    if(it.type.startsWith("image/")){const el=selEl();setImage(it.getAsFile(),el&&el.type==="image"&&!el.a?el.id:null);e.preventDefault();return;}
  }
  if(ui.clip){const c=clone(ui.clip);c.id=uid();c.x+=2;c.y+=2;ui.clip=clone(c);addEl(c);}
});

/* ---------- キーボード ---------- */
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable)return;
  if(!$("modal").hidden){if(e.key==="Escape")$("modal").hidden=true;return;}
  const el=selEl(),mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==="z"){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&k==="y"){e.preventDefault();redo();return;}
  if(mod&&k==="d"){e.preventDefault();duplicate();return;}
  if(mod&&k==="c"){if(el)ui.clip=clone(el);return;}
  if(e.key==="Escape"){if(ui.crop){ui.crop=false;renderOverlay();renderProps();}else if(ui.sel){ui.sel=null;renderOverlay();renderProps();}return;}
  if(e.key==="Tab"){
    e.preventDefault();const a=cur().els;if(!a.length)return;
    const i=a.findIndex(x=>x.id===ui.sel);ui.sel=a[(i+(e.shiftKey?-1:1)+a.length)%a.length].id;ui.crop=false;renderOverlay();renderProps();return;
  }
  if(!el)return;
  if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();removeSel();return;}
  if(e.key==="Enter"){e.preventDefault();editEl(el);return;}
  const st=e.shiftKey?1:.2,mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if(mv){e.preventDefault();if(ui.crop&&el.type==="image"){el.cx+=mv[0];el.cy+=mv[1];}else{el.x+=mv[0];el.y+=mv[1];}touch(el);changedSoon();}
});

/* ---------- 印刷 ---------- */
async function doPrint(list){
  applyPaper();
  $("print").replaceChildren(...list.map(buildPage));
  try{await document.fonts.ready;}catch(e){}
  setTimeout(()=>window.print(),150);
}
$("printCur").onclick=()=>doPrint([cur()]);
$("printAll").onclick=()=>doPrint(state.covers);

window.addEventListener("resize",fit);
(async()=>{
  const s=await DB.get();
  if(s&&Array.isArray(s.covers)&&s.covers.length){
    const covers=s.covers.map(c=>({id:c.id||uid(),bg:c.bg||"#ffffff",els:(c.els||[]).filter(x=>MK[x.type]).map(norm)}));
    const used=usedAssets(covers),assets={};used.forEach(a=>{if(s.assets&&s.assets[a])assets[a]=s.assets[a];});   // 使われていない画像は捨てる
    state={paper:PAPERS[s.paper]?s.paper:"B4",cur:Math.min(s.cur||0,covers.length-1),covers,assets,mono:s.mono!==false};
  }
  applyPaper();applyMono();fullRender();
  hist=[snap()];hi=0;updateUndoBtns();
})();
</script>
